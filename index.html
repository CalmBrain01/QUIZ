  document.querySelectorAll(".opt").forEach(e=>e.classList.toggle("sel",e.dataset.o===id));
  $("nx").disabled=false;
}

function toggle(id){
  if(cur.submitting) return;
  const o=cur.opens[id]||(cur.opens[id]={order:null,count:0,total_ms:0,since:null,first_at_ms:null});
  const el=$("imp-"+id),btn=document.querySelector(`[data-v=${id}]`);
  if(o.since===null){ // open
    o.since=performance.now(); o.count++;
    if(o.order===null){o.order=++cur.order;o.first_at_ms=Math.round(o.since-cur.t0)}
    el.classList.add("open");btn.setAttribute("aria-expanded","true");btn.textContent="Hide Implications";
  } else {close(id)}
}
function close(id){
  const o=cur.opens[id]; if(!o||o.since===null) return;
  o.total_ms+=Math.round(performance.now()-o.since);o.since=null;
  $("imp-"+id).classList.remove("open");
  const b=document.querySelector(`[data-v=${id}]`);b.setAttribute("aria-expanded","false");b.textContent="View Implications";
}
document.addEventListener("visibilitychange",()=>{ // pause timers while tab hidden
  if(!cur||cur.submitting) return;
  Object.entries(cur.opens).forEach(([id,o])=>{
    if(document.hidden&&o.since!==null){o.total_ms+=Math.round(performance.now()-o.since);o.since=null;o.paused=true}
    else if(!document.hidden&&o.paused){o.since=performance.now();o.paused=false}
  });
});

function buildPayload(){
  const end=performance.now(); Object.keys(cur.opens).forEach(id=>{const o=cur.opens[id];if(o.since!==null){o.total_ms+=Math.round(end-o.since);o.since=null}});
  const opt=id=>cur.q.options.find(o=>o.id===id);
  const views=Object.entries(cur.opens).map(([id,o])=>({option:id,open_order:o.order,times_opened:o.count,total_view_ms:o.total_ms,first_opened_at_ms:o.first_at_ms})).sort((a,b)=>a.open_order-b.open_order);
  const sel=opt(cur.selected);
  const readable=views.map(v=>v.option+") "+opt(v.option).text+" -> "+opt(v.option).label+": "+opt(v.option).implication).join(" | ");
  return {submission_id:S.sid+":"+cur.q.id,session_id:S.sid,question_id:cur.q.id,question_number:cur.q.number,type:"question",
    question:cur.q.text,
    selected_answer:cur.selected,selected_answer_text:sel.text,
    selected_answer_implication:sel.label+": "+sel.implication,
    implications_checked:views.map(v=>v.option).join(","),
    implications_checked_details:readable||"none",
    answer_changes:JSON.stringify(cur.changes),implications_viewed:JSON.stringify(views),
    view_order:views.map(v=>v.option).join(","),completion_ms:Math.round(end-cur.t0),started_at:cur.started,submitted_at:new Date().toISOString(),user_agent:navigator.userAgent};
}

async function next(){
  if(busy||!cur||!cur.selected) return; busy=true; cur.submitting=true;
  const btn=$("nx"); btn.disabled=true;  $("er").textContent="";
  document.querySelectorAll("input,.vi").forEach(e=>e.disabled=true);
  const qid=cur.q.id;
  if(!S.pending||S.pending.question_id!==qid){S.pending=buildPayload();save()} // freeze payload; retries reuse same submission_id
  try{
    await post(S.pending);
    S.done.push(qid);S.answers[qid]=S.pending.selected_answer;S.pending=null;save(); // acknowledged → irreversible
    busy=false; route();
  }catch(e){
    busy=false; btn.disabled=false; btn.textContent="Retry";
    $("er").textContent="Couldn't confirm delivery ("+(e.name==="AbortError"?"timed out":e.message)+"). Your answer is kept — press Retry.";
  }
}

/* ===== COMPLETION ===== */
function finish(){
  progress(); cur=null;
  app.innerHTML=`<div class="card"><h1>Finished</h1><button class="s" id="vr">View results</button><button class="s" id="sh" ${S.shared?"disabled":""}>${S.shared?"Shared with forum":"Share results with the forum"}</button>
   <div id="res"></div><div class="err" id="er"></div></div>`;
  $("vr").onclick=results; $("sh").onclick=share;
}
function tally(){const c={};QUESTIONS.forEach(q=>{const o=q.options.find(o=>o.id===S.answers[q.id]);if(o)c[o.label]=(c[o.label]||0)+1});return Object.entries(c).sort((a,b)=>b[1]-a[1])}
function results(){const t=tally();$("res").innerHTML=`<p style="margin-top:16px"><b>Your profile: ${esc(t[0]?t[0][0]:"—")}</b></p>`+t.map(([k,v])=>`<div class="t"><span>${esc(k)}</span><span>${v}</span></div>`).join("")}
async function share(){
  const b=$("sh");b.disabled=true;b.textContent="Sharing…";$("er").textContent="";
  try{await post({submission_id:S.sid+":share",session_id:S.sid,type:"forum_share",results:JSON.stringify(tally()),submitted_at:new Date().toISOString()});
    S.shared=true;save();b.textContent="Shared with forum"}
  catch(e){b.disabled=false;b.textContent="Retry sharing";$("er").textContent="Sharing failed: "+e.message}
}
route();
</script>
</body></html>
